name: Identity v2 live validation
on:
  push:
    paths:
      - ".github/workflows/identity-v2-live.yml"
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/migrate.js /tmp/identity-v2.sqlite
      - name: Collect Bunjang sample
        env:
          DATABASE_PATH: /tmp/identity-v2.sqlite
          BUNJANG_SEARCH_KEYWORDS: "기타,통기타,어쿠스틱 기타"
          BUNJANG_RESULTS_PER_KEYWORD: "10"
          BUNJANG_ENRICH_DETAILS: "true"
        run: npm run collect:bunjang
      - name: Diagnose identity
        env:
          DATABASE_PATH: /tmp/identity-v2.sqlite
          IDENTITY_DIAGNOSTIC_LOOKBACK_DAYS: "30"
          IDENTITY_DIAGNOSTIC_LIMIT: "30"
        run: npm run diagnose:identity
      - name: Analyze reference coverage
        env:
          DATABASE_PATH: /tmp/identity-v2.sqlite
          REFERENCE_COVERAGE_LOOKBACK_DAYS: "30"
        run: npm run analyze:reference-coverage
