name: Retail brand search capture
on:
  push:
    paths:
      - ".github/workflows/retail-brand-search.yml"
      - "scripts/capture-retail-brand-search.js"
jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/capture-retail-brand-search.js
