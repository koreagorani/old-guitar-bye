name: Gopherwood parser structure
on:
  push:
    paths:
      - ".github/workflows/gopherwood-structure.yml"
      - "scripts/capture-gopherwood-structure.js"
jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/capture-gopherwood-structure.js
