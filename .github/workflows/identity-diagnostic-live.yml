name: Identity diagnostic live
on:
  push:
    paths:
      - ".github/workflows/identity-diagnostic-live.yml"
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/migrate.js /tmp/identity-diagnostic.sqlite
      - name: Collect Bunjang sample
        env:
          DATABASE_PATH: /tmp/identity-diagnostic.sqlite
          BUNJANG_SEARCH_KEYWORDS: "기타,통기타,어쿠스틱 기타"
          BUNJANG_RESULTS_PER_KEYWORD: "10"
          BUNJANG_ENRICH_DETAILS: "true"
        run: npm run collect:bunjang
      - name: Diagnose current normalizer
        env:
          DATABASE_PATH: /tmp/identity-diagnostic.sqlite
          IDENTITY_DIAGNOSTIC_LOOKBACK_DAYS: "30"
          IDENTITY_DIAGNOSTIC_LIMIT: "30"
        run: npm run diagnose:identity
