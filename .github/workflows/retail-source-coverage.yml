name: Retail source coverage capture

on:
  push:
    paths:
      - ".github/workflows/retail-source-coverage.yml"
      - "scripts/capture-retail-source-coverage.js"

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/capture-retail-source-coverage.js
