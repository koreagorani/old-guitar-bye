name: MusicForce exact coverage
on:
  push:
    paths:
      - ".github/workflows/musicforce-exact.yml"
      - "scripts/capture-musicforce-exact.js"
jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/capture-musicforce-exact.js
