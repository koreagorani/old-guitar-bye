name: Reference coverage live validation

on:
  push:
    paths:
      - ".github/workflows/reference-coverage-live.yml"

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Prepare temporary database
        run: node scripts/migrate.js /tmp/reference-coverage.sqlite
      - name: Collect low-frequency live Bunjang sample
        env:
          DATABASE_PATH: /tmp/reference-coverage.sqlite
          BUNJANG_SEARCH_KEYWORDS: "기타,통기타,어쿠스틱 기타"
          BUNJANG_RESULTS_PER_KEYWORD: "5"
          BUNJANG_ENRICH_DETAILS: "false"
        run: npm run collect:bunjang
      - name: Analyze reference coverage
        env:
          DATABASE_PATH: /tmp/reference-coverage.sqlite
          REFERENCE_COVERAGE_LOOKBACK_DAYS: "30"
          REFERENCE_COVERAGE_EXAMPLE_TITLES: "3"
        run: npm run analyze:reference-coverage
